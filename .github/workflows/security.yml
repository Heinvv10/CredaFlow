name: security

# Scans, kept apart from quality-gate.yml so they neither slow nor loosen the
# required `quality` and `integration` checks. Every third-party action is pinned
# to a full commit SHA; scanner binaries are pinned by version AND sha256, and
# semgrep and its dependencies by hash, so a moved tag cannot change what runs here.
# Not wired into branch protection: add `sast`, `dependencies`, `secrets` and
# `image` as required checks when the first runs are green.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Weekly: new advisories land against code that has not changed.
  schedule:
    # 03:30 UTC Monday = 05:30 SAST.
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis of the TypeScript source (semgrep hash-locked, installed by a pinned uv). Semgrep rather than CodeQL: CodeQL
  # code scanning on a private repository needs GitHub Advanced Security.
  sast:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, velo, credaflow]
    timeout-minutes: 20
    steps:
      # Fail closed if a fork PR ever reaches this runner.
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::fork pull requests must not run on the self-hosted runner"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # --severity ERROR: the findings the rule authors rate high-confidence.
      # --exclude-rule gcm-no-tag-length: three known findings, accepted until the
      # fix lands. lib/storage-crypto.ts slices fixed-width tags (a false
      # positive); lib/crypto/secret-box.ts openSecret() takes the tag length from
      # the stored value (real, low severity: needs write access to the database).
      # Fix with `{ authTagLength: 16 }`, then delete this exclusion.
      # Nothing persists between jobs: uv, its cache and the venv live in
      # RUNNER_TEMP, are removed first, and uv is re-hashed on every run. Semgrep
      # and every transitive dependency are installed with --require-hashes from
      # .github/ci/semgrep-requirements.txt (regenerate: uv pip compile
      # --generate-hashes --python-version 3.12 --python-platform
      # x86_64-unknown-linux-gnu, from semgrep-requirements.in). The runner must
      # have CPython 3.12: uv may not download one, and may not build from source.
      - name: Semgrep
        env:
          UV_VERSION: 0.13.6
          UV_SHA256: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        run: |
          rm -rf "$RUNNER_TEMP/uv.tgz" "$RUNNER_TEMP/uvbin" "$RUNNER_TEMP/semgrep-venv" "$UV_CACHE_DIR" "$UV_PYTHON_INSTALL_DIR"
          curl -sSfL -o "$RUNNER_TEMP/uv.tgz" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  $RUNNER_TEMP/uv.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/uvbin" && tar -xzf "$RUNNER_TEMP/uv.tgz" -C "$RUNNER_TEMP/uvbin" --strip-components=1
          "$RUNNER_TEMP/uvbin/uv" --no-python-downloads venv --python 3.12 "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/uvbin/uv" pip install --no-build --python "$RUNNER_TEMP/semgrep-venv/bin/python" --require-hashes -r .github/ci/semgrep-requirements.txt
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --metrics=off --error --severity ERROR \
            --config p/typescript --config p/nextjs --config p/security-audit \
            --exclude-rule javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length \
            --exclude node_modules --exclude '*.test.ts' --exclude '*.test.tsx' \
            --exclude .claude --exclude docs .

  # Known-vulnerable production dependencies. The repo's own script, narrowed to
  # what ships (--omit=dev) and to what blocks (high and critical); the full
  # moderate list stays available locally with `npm run audit:security`.
  dependencies:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, velo, credaflow]
    timeout-minutes: 10
    steps:
      # Fail closed if a fork PR ever reaches this runner.
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::fork pull requests must not run on the self-hosted runner"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # npm audit reads package-lock.json; it installs nothing.
      - name: npm audit (production, high and above)
        run: npm run audit:security -- --omit=dev --audit-level=high

  # Secrets in the working tree and in history. Findings already in synthetic test
  # fixtures are fingerprinted in .gitleaksignore; anything new fails.
  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, velo, credaflow]
    timeout-minutes: 10
    steps:
      # Fail closed if a fork PR ever reaches this runner.
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::fork pull requests must not run on the self-hosted runner"
          exit 1

      # The runner workspace persists, and its .git keeps refs fetched for other
      # PRs (refs/remotes/pull/*) that `gitleaks detect --all` would scan. Start
      # from an empty .git so the scan sees only what a fresh clone has.
      - name: Drop stale git state
        run: rm -rf "${GITHUB_WORKSPACE:?}/.git"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          rm -rf "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks.tgz"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --no-banner --redact --exit-code 1 --log-opts="--all"

  # Both images the Helm chart deploys: the runner and the migration runner. HIGH
  # and CRITICAL fail the job. --ignore-unfixed: a CVE with no fixed package yet
  # cannot be acted on; the weekly run catches it once a fix ships. Accepted
  # exceptions go in .trivyignore with a reason and an expiry date.
  # Stays on a GitHub-hosted runner: it needs docker, and giving the self-hosted
  # runner user docker access would be root-equivalent on velo-server.
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build --target migrator -t credaflow-migrate:scan .
          docker build -t credaflow:scan .
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/trivy" && tar -xzf trivy.tgz -C "$RUNNER_TEMP/trivy" trivy
      - name: Scan images
        run: |
          for image in credaflow:scan credaflow-migrate:scan; do
            "$RUNNER_TEMP/trivy/trivy" image --no-progress --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
