name: ci

# One workflow owns every required gate. Keeping the quality and integration
# jobs separate lets the real-DB suite run in parallel, while folding the
# agent-doc and date checks into quality avoids two runner startups and two
# duplicate npm installs on every revision.
#
# GitHub-hosted runners (ubuntu-latest). postgresql-16 (for
# scripts/ci/pg-cluster.sh, PG_BIN default /usr/lib/postgresql/16/bin),
# poppler-utils and qpdf are apt-installed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # No `push: main` trigger. main's branch protection requires `quality` and
  # `integration` with "require branches to be up to date" (strict) and
  # enforce_admins, so a PR can only merge after both jobs passed on a head
  # that already contains the current main. The merged tree is the tested
  # tree, so re-running quality on the push to main repeated ~28 min of work
  # per merge and found nothing new (integration already skipped push). The
  # local merge queue (mq) merges through PRs and reads only PR-head checks.
  # Main is still checked nightly (integration) and on demand
  # (workflow_dispatch). Restore the trigger if strict is ever turned off.
  #
  # Caches saved on main are what PRs restore. The nightly run refreshes the
  # npm cache; after changing lib/kyc/face-model/models.ts, run
  # `gh workflow run ci --ref main` once so PRs reuse the face-model cache.
  schedule:
    # 02:30 UTC = 04:30 SAST. The nightly run executes integration only.
    - cron: '30 2 * * *'
  workflow_dispatch:

# Nothing here pushes, comments, or calls the API.
permissions:
  contents: read

# A new revision of a PR cancels both jobs from the obsolete revision. PR,
# schedule and manual runs use separate groups, so a nightly run cannot cancel
# a manual main run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks, face models and build. The unit suites run beside this job
  # in the `unit` shards; the `quality` job below is the required check.
  checks:
    # Draft PR synchronization is deliberately free. Marking the PR ready
    # emits ready_for_review and runs the complete gate. Scheduled runs need
    # only the real-DB integration job below.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # Unit + build took 29.5 min on 2026-10-21 (run 39611551763), and 30
    # cancelled the next run (39633530189) with no failure.
    timeout-minutes: 45

    env:
      TZ: UTC
      PUPPETEER_SKIP_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is required: plain npm ci fails on the next-auth
      # beta peer conflict. See CLAUDE.md "Tool Overrides".
      - name: Install
        run: npm ci --legacy-peer-deps

      # Must precede tsc: the Prisma client types come from generate.
      - name: Generate Prisma client
        run: npx prisma generate

      # Must precede tsc too: lib/registry/generated/ is not committed
      # (scripts/gen-registries.ts; npm ci's postinstall also writes it).
      - name: Generate registries
        run: npm run gen:registries

      # A cold root typecheck exceeds 4 GiB; demo keeps its own budget.
      - name: Typecheck
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # scripts/demo is excluded from the root tsconfig and has its own gate.
      - name: Typecheck demo simulator
        run: npm run demo:typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Type-aware rules (eslint.config.mjs) build a TypeScript program: about
      # 6 GB resident, past Node's default heap.
      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # These checks take seconds once dependencies are installed. They used
      # to pay for two separate runners and npm installs.
      - name: Documented paths resolve
        run: npm run claude-md:check

      - name: AGENTS.md mirrors match CLAUDE.md
        run: npm run agents:check

      # The checker builds a full program over the repo; 2 GiB is not enough.
      - name: No local-zone calendar boundaries
        run: npm run dates:check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The base Vitest config pins UTC, so explicitly exercise other zones.
      - name: Date helpers are timezone-independent
        run: npm run test:tz

      # models.ts pins every model file's SHA-256. The fetch re-checks a cached
      # file and downloads only what is missing or wrong.
      - name: Cache face models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: face-models
          key: face-models-${{ hashFiles('lib/kyc/face-model/models.ts') }}

      - name: Fetch face models
        run: npm run face-models:fetch

      - name: Face model tests (real ONNX models)
        run: npx vitest run lib/kyc/face-model/compare.models.test.ts
        env:
          FACE_MODEL_TESTS: 1

      - name: Build
        run: npm run build
        env:
          # Next runs the root TypeScript graph again in its build worker.
          NODE_OPTIONS: --max-old-space-size=6144

  # The repo is private, so ubuntu-latest has 2 vCPUs and Vitest's default is
  # one worker: one `npx vitest run` took 18.5 min (run 39638498981). Three
  # shards of two workers each finished in 2.7-3.1 min on 2 pinned velo cores,
  # with the same file and test counts as one unsharded run.
  unit:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every shard's failures, as the single run did.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      TZ: UTC
      PUPPETEER_SKIP_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate registries
        run: npm run gen:registries

      # The unit suites shell out to pdftoppm/pdfinfo and qpdf.
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf

      - name: Unit tests
        run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=2

  # Branch protection requires a check named exactly `quality`. It passes only
  # if `checks` and every unit shard succeeded. always() keeps it from being
  # skipped (a skipped required check counts as passing) when a shard fails or
  # is cancelled; drafts and scheduled runs still skip it, as before.
  quality:
    needs: [checks, unit]
    if: always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checks and every unit shard succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "checks: ${CHECKS}, unit: ${UNIT}"
          [[ "$CHECKS" == success && "$UNIT" == success ]]

  integration-shard:
    # Main is tested as a candidate merge by the PR event and again nightly.
    # Avoid paying for the same integration suite immediately after each merge.
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # The serial suite (--no-file-parallelism) reached ~29 min on main by
    # 2026-10-20; 30 cancelled green runs part-way. With slice 5's suites
    # (440 gated) it was still running, with no failure, when 45 cancelled it
    # on 2026-10-21 (run 39611551763). Split three ways (IT_SHARD below),
    # each shard runs about a third of it.
    timeout-minutes: 45
    # Three jobs, each with its own database, run a third of the suites each
    # (scripts/integration-weights.txt balances them). The `integration` job
    # below is the required check; these report as `integration shard i/3`.
    name: integration shard ${{ matrix.shard }}/${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      TZ: UTC
      IT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline ratchet needs the merge base with the target branch.
          fetch-depth: 0

      # A throwaway PostgreSQL 16 cluster of this job's own, (apt-installed, no
      # docker service): own directory, OS-assigned loopback port, never shared with the
      # other shard on this machine. These suites create and delete real rows.
      # scripts/ci/pg-cluster.sh exports DATABASE_URL and CI_PG_DIR.
      # The image has no server binaries at PG_BIN; Ubuntu 24.04 packages 16.
      - name: Install PostgreSQL 16 and PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 poppler-utils

      - name: Start PostgreSQL
        run: bash scripts/ci/pg-cluster.sh start

      # The integration baseline is a debt register and may only shrink.
      # Once per run: the check reads only git, so shard 1 carries it.
      - name: Baseline may only shrink
        if: github.event_name == 'pull_request' && matrix.shard == 1
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASELINE=scripts/integration-baseline.txt

          git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          MERGE_BASE=$(git merge-base "origin/${BASE_REF}" HEAD)

          if ! git cat-file -e "${MERGE_BASE}:${BASELINE}" 2>/dev/null; then
            echo ">> no baseline at the merge base — this PR introduces it; nothing to ratchet"
            exit 0
          fi

          if [[ ! -f "$BASELINE" ]]; then
            echo "!! ${BASELINE} exists at the merge base and is gone at HEAD." >&2
            echo "!! Moving or deleting the debt register bypasses this check." >&2
            exit 1
          fi

          before=$(mktemp); after=$(mktemp)
          git show "${MERGE_BASE}:${BASELINE}" > "$before"
          bash scripts/run-integration-tests.sh --print-baseline "$before" > "${before}.n"
          bash scripts/run-integration-tests.sh --print-baseline "$BASELINE" > "$after"

          added=$(comm -13 "${before}.n" "$after")
          if [[ -n "$added" ]]; then
            echo "!! This PR ADDS suites to the integration baseline:" >&2
            echo "$added" >&2
            echo "!! The baseline may only shrink. Fix the suite instead." >&2
            exit 1
          fi
          echo ">> baseline did not grow ($(wc -l < "${before}.n") entries at the merge base, $(wc -l < "$after") now)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      # migrate deploy, not db push: triggers and CHECK constraints live in migrations.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Integration gate
        run: bash scripts/run-integration-tests.sh

      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/ci/pg-cluster.sh stop "${CI_PG_DIR:-}"

  # Branch protection requires a check named exactly `integration`. It passes
  # only when every shard passed. always(), because a skipped required check
  # counts as passing: without it a failed or cancelled shard would skip this
  # job and let the PR through. Drafts and the conditions on the shards
  # still skip it, exactly as they skip the shards.
  integration:
    # Seconds of work and no checkout; it is a required check.
    needs: integration-shard
    if: always() && github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.integration-shard.result }}
        run: |
          echo ">> integration shards: ${RESULT}"
          [[ "$RESULT" == "success" ]]
