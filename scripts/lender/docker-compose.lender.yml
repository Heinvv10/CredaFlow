# One lender = one compose project = one app, one Postgres and their named
# volumes. provision-lender.sh copies this file into the lender directory;
# every script runs it as `-p credaflow-<slug> --project-directory <lender-dir>
# --env-file .env --env-file state/image.env`, so nothing here is host-specific:
# no container_name, no fixed port, no path outside the lender directory.
#
# APP_IMAGE comes from state/image.env (written by deploy.sh), never from .env,
# so it does not leak into the container and a rollback is one file write.
# Database credentials come from .env (mode 0600, generated, never echoed).
#
# The database is not published. Operator tooling (migrations, bootstrap,
# backup, restore) reaches it over the project network or `compose exec`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ${APP_IMAGE:?APP_IMAGE is unset: deploy with deploy.sh, which writes state/image.env}
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      NODE_ENV: production
      PORT: "3300"
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${NEXTAUTH_SECRET}
    # Bound to loopback by default: a TLS-terminating reverse proxy on the host
    # (or the managed platform's router) fronts it. Set APP_BIND to publish wider.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:?APP_PORT is unset in .env}:3300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3300/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
