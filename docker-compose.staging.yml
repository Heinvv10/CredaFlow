# A staging stack that can run beside docker-compose.yml on one Docker host:
# it binds 127.0.0.1:3301 (in-container 3300), keeps its own credentials in
# .env.staging and its own uploads volume. Public access goes through the
# host's TLS-terminating reverse proxy.
#
# The explicit project name keeps Docker from merging this stack with the
# main one (which defaults to the working-directory name) — without it,
# `docker compose down` against either stack would tear down a shared network.
name: credaflow-staging

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        NEXT_PUBLIC_TENANT_SLUG: ${NEXT_PUBLIC_TENANT_SLUG:?set NEXT_PUBLIC_TENANT_SLUG to the Tenant.slug of this deployment}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: credaflow:staging
    container_name: credaflow-staging-app
    env_file:
      - path: .env.staging
        required: false
    environment:
      NODE_ENV: production
      PORT: 3300
      HOSTNAME: 0.0.0.0
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL to the staging origin}
    ports:
      - "127.0.0.1:3301:3300"
    restart: unless-stopped
    volumes:
      - uploads_staging:/app/uploads
volumes:
  uploads_staging:
