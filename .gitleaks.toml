# gitleaks configuration (v8.30.1). Used by the pre-commit hook and by CI.
title = "CredaFlow gitleaks config"

[extend]
useDefault = true

# Synthetic test-fixture values that trip the generic-api-key rule in a working-tree
# scan (`gitleaks dir .`). History scans are covered by the per-commit
# fingerprints in .gitleaksignore. Scope: these exact test files and only the
# generic-api-key rule, so any other secret type in them is still reported.
# Do NOT add .claude/handoffs/ or any non-test path here.
[[allowlists]]
description = "Synthetic test fixtures (generic-api-key only)"
targetRules = ["generic-api-key"]
paths = [
  '''^app/api/health/route\.test\.ts$''',
  '''^app/api/integrations/isaflow/route\.test\.ts$''',
  '''^app/api/website/apply/route\.test\.ts$''',
  '''^lib/crm/lead-outreach\.test\.ts$''',
  '''^prisma/seed\.integration\.test\.ts$''',
]
