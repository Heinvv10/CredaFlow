{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "credaflow.fullname" . }}
  labels:
    {{- include "credaflow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
