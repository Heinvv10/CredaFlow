{{- if .Values.networkPolicy.enabled }}
# Web: reachable from the ingress controller (and the metrics scraper); talks to DNS,
# PostgreSQL and outbound provider ports only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "credaflow.fullname" . }}-web
  labels:
    {{- include "credaflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "credaflow.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml (concat .Values.networkPolicy.ingressFrom .Values.networkPolicy.metricsFrom) | nindent 8 }}
      ports:
        - { protocol: TCP, port: 3300 }
  egress:
    {{- include "credaflow.egressRules" . | nindent 4 }}
---
# Worker and migration Job: nothing reaches them (the worker calls its own server on
# loopback); same egress as web.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "credaflow.fullname" . }}-internal
  labels:
    {{- include "credaflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [worker, migrate]
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.metricsFrom }}
    # The worker is scraped too (cron outcome counters live in its memory).
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - { protocol: TCP, port: 3300 }
    {{- else }}
    []
    {{- end }}
  egress:
    {{- include "credaflow.egressRules" . | nindent 4 }}
{{- end }}
