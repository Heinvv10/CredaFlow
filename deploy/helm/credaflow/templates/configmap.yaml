apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "credaflow.fullname" . }}
  labels:
    {{- include "credaflow.labels" . | nindent 4 }}
data:
  {{- range $name, $value := .Values.config }}
  {{- if ne ($value | toString) "" }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
