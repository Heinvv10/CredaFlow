{{- if .Values.worker.enabled }}
{{- include "credaflow.assertWorkerSecretsApart" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "credaflow.fullname" . }}-worker
  labels:
    {{- include "credaflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Exactly one: see values.yaml. Not scaled by the HPA, not given a PodDisruptionBudget.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "credaflow.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "credaflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "credaflow.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "credaflow.podSecurityContext" . | nindent 8 }}
      containers:
        {{- include "credaflow.appContainer" (dict "root" . "component" "worker" "appMode" .Values.worker.appMode "cronScheduler" "on" "resources" .Values.worker.resources "extraEnv" .Values.worker.extraEnv "secrets" .Values.worker.existingSecrets) | nindent 8 }}
      volumes:
        {{- include "credaflow.runtimeVolumes" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
