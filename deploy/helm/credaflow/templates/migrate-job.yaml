{{- if .Values.migrate.enabled }}
{{- include "credaflow.assertOwnerSecretApart" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "credaflow.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "credaflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs and must succeed before Helm creates or updates anything else, so the new
    # schema is in place before the new pods start. A failed Job fails the release.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "credaflow.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # The default ServiceAccount: this Job runs before the chart's own exists.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "credaflow.migrateImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # DATABASE_URL alone: the ConfigMap does not exist yet on a first install, and the
          # Job has no use for the other secrets.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrate.databaseUrlSecret.name }}
                  key: {{ .Values.migrate.databaseUrlSecret.key }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- include "credaflow.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
