apiVersion: v1
kind: Service
metadata:
  name: {{ include "credaflow.fullname" . }}
  labels:
    {{- include "credaflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "credaflow.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
