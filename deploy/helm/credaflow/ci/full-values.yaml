# Every optional template on, for helm lint / template / kubeconform in CI.
image:
  tag: ci
config:
  NEXTAUTH_URL: https://staff.lender.example
  AUTH_URL: https://staff.lender.example
observability:
  otlpEndpoint: http://otel-collector.observability:4318
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: staff.lender.example
  tls:
    - secretName: staff-tls
      hosts: [staff.lender.example]
serviceMonitor:
  enabled: true
autoscaling:
  targetMemoryUtilizationPercentage: 80
# The supported production shape: a web login and a worker login, the worker with its own Secret.
appRole:
  workerName: credaflow_worker
  passwordSecret: { name: credaflow-db-passwords, key: WEB_PASSWORD }
  workerPasswordSecret: { name: credaflow-db-passwords, key: WORKER_PASSWORD }
worker:
  existingSecrets: [credaflow-worker]
